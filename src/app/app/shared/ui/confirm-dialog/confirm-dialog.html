<div class="confirm-dialog__backdrop" (click)="onCancel()"></div>
<div class="confirm-dialog" role="alertdialog" aria-modal="true">
    <h3 class="confirm-dialog__title">{{ title }}</h3>
    <p class="confirm-dialog__text">{{ text }}</p>
    <div class="confirm-dialog__actions">
        <app-button [label]="cancelLabel" variant="secondary" (pressed)="onCancel()" />
        <app-button [label]="confirmLabel" variant="primary" [disabled]="loading" (pressed)="onConfirm()" />
    </div>
</div>
