<div class="participants-popup__backdrop" (click)="onClose()"></div>
<div class="participants-popup" role="dialog" aria-modal="true" [attr.aria-label]="t()('participantsTitle')">
    <div class="participants-popup__header">
        <h3 class="participants-popup__title">{{ t()('participantsTitle') }}</h3>
        <button type="button" class="participants-popup__close" (click)="onClose()" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>

    @if (participants.length === 0) {
    <p class="participants-popup__empty">{{ t()('noParticipantsYet') }}</p>
    } @else {
    <ul class="participants-popup__list">
        @for (participant of participants; track participant.respondedAt; let i = $index) {
        <li class="participants-popup__item">
            <span class="participants-popup__index">{{ i + 1 }}</span>
            <span class="participants-popup__name">{{ displayName(participant) }}</span>
        </li>
        }
    </ul>
    }
</div>
